<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>všetko najlepšie k výročiu jasi</title>
  
  <meta name="description" content="Záhrada spomienok pre Jasi.">
  <meta name="theme-color" content="#0d0a13">
  
  <!-- Refined Typography: Playfair Display & Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23694b7c'/><circle cx='50' cy='50' r='14' fill='%23eed598'/></svg>">
</head>
<body>

  <!-- Falling Petals Canvas -->
  <canvas id="petals-canvas"></canvas>

  <!-- ==========================================================================
       INTRO SCREEN: "všetko najlepšie k výročiu jasi"
       ========================================================================== -->
  <div id="intro-screen" class="intro-screen">
    <div class="intro-stars"></div>
    <div class="intro-content">
      <h1 class="intro-title" id="intro-main-title">všetko najlepšie k výročiu jasi</h1>
    </div>
  </div>

  <!-- ==========================================================================
       HEADER: Clean & Understated
       ========================================================================== -->
  <header class="app-header">
    <div class="header-brand" id="brand-home-btn" title="Návrat na začiatok">
      <span class="header-title">pre jasi</span>
    </div>

    <div class="header-controls">
      <!-- Only the requested "Náhodná" button -->
      <button id="random-memory-btn" class="control-btn" title="Zobraziť náhodnú spomienku">
        <span class="btn-label">Náhodná</span>
      </button>
    </div>
  </header>

  <!-- ==========================================================================
       GARDEN TOOLBAR: Minimalist & Pure
       ========================================================================== -->
  <div class="filter-bar-container">
    <div class="filter-bar-top">
      <div class="garden-stats">
        <span id="rendered-count-text">824 kvetov</span>
        <span class="stat-dot">•</span>
        <span>záhrada našich spomienok</span>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Hľadať dátum...">
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       GARDEN CONTAINER (FLOWER MEADOW)
       ========================================================================== -->
  <main class="garden-main" id="garden-container">
    <!-- Rendered via app.js -->
  </main>

  <!-- ==========================================================================
       PHOTO LIGHTBOX MODAL
       ========================================================================== -->
  <div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true" aria-label="Fotografia">
    <div class="lightbox-container" id="lightbox-container">
      
      <!-- Header -->
      <div class="lightbox-header">
        <div class="lightbox-info">
          <div class="lightbox-date" id="lightbox-date-text">20. decembra 2025</div>
          <div class="lightbox-meta">
            <span id="lightbox-day-text">sobota, 17:42</span>
            <span class="meta-dot">•</span>
            <span id="lightbox-counter-text">142 / 824</span>
          </div>
        </div>

        <div class="lightbox-actions">
          <button id="lightbox-zoom-btn" class="lightbox-btn" title="Priblížiť">zoom</button>
          <a id="lightbox-download-btn" class="lightbox-btn" title="Stiahnuť" download>stiahnuť</a>
          <button id="lightbox-close-btn" class="lightbox-btn" title="Zatvoriť (Esc)">✕</button>
        </div>
      </div>

      <!-- Media Display -->
      <div class="lightbox-media-wrapper" id="lightbox-media-wrapper">
        <div class="lightbox-loader" id="lightbox-loader"></div>
        <img id="lightbox-img" class="lightbox-image" src="" alt="Spomienka" style="display: none;">
        <video id="lightbox-video" class="lightbox-video" controls playsinline style="display: none;"></video>
        
        <button id="lightbox-prev-btn" class="lightbox-nav-btn lightbox-prev" title="Predchádzajúca">‹</button>
        <button id="lightbox-next-btn" class="lightbox-nav-btn lightbox-next" title="Nasledujúca">›</button>
      </div>

      <!-- Footer -->
      <div class="lightbox-footer">
        <div class="lightbox-counter">
          Prechádzaj šípkami ◀ / ▶ alebo potiahnutím
        </div>
        <div class="lightbox-keyboard-hint">
          Esc pre zatvorenie
        </div>
      </div>

    </div>
  </div>

  <!-- Minimal Footer -->
  <footer class="app-footer">
    <p>pre jasi · 2025 – 2026</p>
  </footer>

  <script src="data.js"></script>
  <script src="flowers.js"></script>
  <script src="app.js"></script>
</body>
</html>
